name: World Card Station desktop CI

on:
  pull_request:
  workflow_call:
    inputs:
      skip_installer_check:
        description: Release workflow builds installers after validation
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build_installers:
        description: Also build and upload desktop installers
        type: boolean
        default: false
  push:
    branches: [master, main]

jobs:
  packaging:
    name: Decide installer verification
    runs-on: ubuntu-22.04
    outputs:
      required: ${{ steps.policy.outputs.required }}
    steps:
      - uses: actions/checkout@v4
      - id: policy
        run: node scripts/ci-installer-policy.mjs
        env:
          SKIP_INSTALLER_CHECK: ${{ inputs.skip_installer_check }}
          BUILD_INSTALLERS: ${{ inputs.build_installers }}

  javascript:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-release-version.cjs
      - run: npm run lint
      - name: Jest and integration tests
        run: npm run test:js

  web:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-22.04
          - browser: firefox
            os: ubuntu-22.04
          - browser: safari
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      WEB_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - name: Install publisher build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pulseaudio pulseaudio-utils
      - name: Prepare virtual audio output
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=wcs_test_audio
          pactl set-default-sink wcs_test_audio
          pactl info
          pactl list short sinks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/tauri -> target
      - name: Enable Safari WebDriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - run: npm run test:web:browser
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-tests-${{ matrix.browser }}
          path: test-results/web/**
          if-no-files-found: warn

  desktop:
    needs: packaging
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb dbus-x11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/tauri -> target
      - run: npm ci
      - run: cargo fmt --manifest-path src/tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src/tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src/tauri/Cargo.toml
        if: runner.os != 'Linux'
      - run: xvfb-run -a cargo test --manifest-path src/tauri/Cargo.toml
        if: runner.os == 'Linux'
      - name: Tauri E2E
        if: runner.os != 'Linux'
        run: npm run test:tauri
      - name: Tauri E2E on Linux
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: dbus-run-session -- xvfb-run -a npm run test:tauri
      - name: Tavern import E2E
        if: runner.os != 'Linux'
        run: npx wdio run wdio.tavern.conf.mjs
      - name: Tavern import E2E on Linux
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: dbus-run-session -- xvfb-run -a npx wdio run wdio.tavern.conf.mjs
      - name: Build desktop installer
        if: needs.packaging.outputs.required == 'true'
        run: npm run tauri:build
      - name: Upload desktop test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-logs-${{ runner.os }}
          path: |
            logs/**
            test-results/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: needs.packaging.outputs.required == 'true'
        with:
          name: world-card-station-${{ runner.os }}
          path: src/tauri/target/release/bundle/**
          if-no-files-found: error
