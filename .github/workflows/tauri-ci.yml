name: World Card Station desktop CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  javascript:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-release-version.cjs
      - run: npm run lint
      - name: Jest and integration tests
        run: npm run test:js

  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb dbus-x11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/tauri -> target
      - run: npm ci
      - run: cargo fmt --manifest-path src/tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src/tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src/tauri/Cargo.toml
        if: runner.os != 'Linux'
      - run: xvfb-run -a cargo test --manifest-path src/tauri/Cargo.toml
        if: runner.os == 'Linux'
      - name: Tauri E2E
        if: runner.os != 'Linux'
        run: npm run test:tauri
      - name: Tauri E2E on Linux
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: dbus-run-session -- xvfb-run -a npm run test:tauri
      - name: Tavern import E2E
        if: runner.os != 'Linux'
        run: npx wdio run wdio.tavern.conf.mjs
      - name: Tavern import E2E on Linux
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: dbus-run-session -- xvfb-run -a npx wdio run wdio.tavern.conf.mjs
      - name: Build desktop installer
        run: npm run tauri:build
      - name: Upload desktop test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-logs-${{ runner.os }}
          path: |
            logs/**
            test-results/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: world-card-station-${{ runner.os }}
          path: src/tauri/target/release/bundle/**
          if-no-files-found: error
