[package]
name = "world-card-station-tauri"
version = "1.0.0"
description = "World Card Station (世界站), an AI roleplay game card platform"
authors = ["World Card Station contributors"]
edition = "2021"
default-run = "world-card-station-tauri"

[lib]
name = "world_card_station_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
atomic-write-file = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
jsonschema = { version = "0.37", default-features = false }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "1.2", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[[bin]]
name = "game-card-export"
path = "src/bin/game_card_export.rs"

[[bin]]
name = "game-card-publish"
path = "src/bin/game_card_publish.rs"
